<!DOCTYPE html>
<html>
<head>
    <title>Warehouse Inventory</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Warehouse Inventory</h1>

        <table>
            <tr>
                <th>Product</th>
                <th>Units</th>
                <th>Quantity</th>
            </tr>

            {% for product, details in inventory.items() %}
            <tr>
                <td>{{ product }}</td>
                <td>{{ details.units }}</td>
                <td>{{ details.qty }}</td>
            </tr>
            {% endfor %}
        </table>

        <br>
        <a class="back-button" href="/">Back</a>
    </div>
</body>
</html>
