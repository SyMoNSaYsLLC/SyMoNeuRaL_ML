<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ ui_get('register.title', 'Create Account') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="bg-grid"></div>
<main class="layout">
  <section class="panel narrow">
    <h2>{{ ui_get('register.heading', 'Create Account') }}</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
    {% endwith %}
    <form method="post">
      <input name="full_name" placeholder="Full name" required>
      <input name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password (min 8)" minlength="8" required>
      <input type="password" name="confirm_password" placeholder="Confirm password" minlength="8" required>
      <button type="submit">{{ ui_get('register.submit', 'Create Account') }}</button>
    </form>
    <div class="action-row">
      <a class="tab-link" href="{{ url_for('login') }}">{{ ui_get('register.loginLink', 'Already have an account? Login') }}</a>
    </div>
  </section>
</main>
</body>
</html>
