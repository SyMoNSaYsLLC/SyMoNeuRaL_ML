<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Avatar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .avatar-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }
        .avatar-option {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 50%;
            transition: border-color 0.3s;
        }
        .avatar-option:hover, .avatar-option.selected {
            border-color: #00aaff;
        }
        .avatar-option img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select Your Avatar</h1>
        <form action="{{ url_for('select_avatar') }}" method="post">
            <div class="avatar-selection">
                <section class="panel">
                  <h3>Select Avatar</h3>

                  <div class="scroll-window avatar-window">
                    <div class="avatar-grid">
                      {% for avatar in avatars %}
                      <label class="avatar-option">
                        <input type="radio" name="avatar" value="{{ avatar }}" required>
                        <img src="{{ url_for('static', filename='avatars/' ~ avatar) }}" alt="{{ avatar }}">
                        <span>{{ avatar.rsplit('.', 1)[0] }}</span>
                      </label>
                      {% endfor %}
                    </div>
                  </div>
                </section>
            </div>
            <button type="submit" class="button">Save Avatar</button>
        </form>
    </div>
    <script>
        document.querySelectorAll('.avatar-option input').forEach(input => {
            input.addEventListener('change', () => {
                document.querySelectorAll('.avatar-option').forEach(label => {
                    label.classList.remove('selected');
                });
                if (input.checked) {
                    input.parentElement.classList.add('selected');
                }
            });
        });
    </script>
</body>
</html>
